<div class="registration-background">
  <div class="container row styled-card">
    <a [routerLink]="['/']" class="d-flex align-items-center home-link">
      <mat-icon class="link-icon">arrow_back_ios_new</mat-icon>
      <span>Home</span></a>
    <div class="text-center">
    <img src="./assets/images/logo.png" alt="logo" class="img-fluid"/>
  </div>
    <div class="welcome text-center">
      <h1>Sign up with email</h1>
      <p class="text-muted">Create your first post, collaborate in real-time, and publish as a team — for free.</p>
    </div>
<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  <div class="form-group  mt-2">
    <label for="username">Name</label>
    <input type="text" class="form-control" id="username" placeholder="Enter your name" formControlName="username">
  </div>
    
    <div class="form-group  mt-2">
      <label for="exampleInputEmail1">Email address</label>
      <input type="email" class="form-control" id="exampleInputEmail1" placeholder="Enter email" formControlName="email">
    </div>
  
    <div class="form-group mt-2">
      <label for="exampleInputPassword1">Password</label>
      <input type="password" class="form-control" placeholder="Password" formControlName="password">
    </div>
  
    <button type="submit"  class="btn btn-secondary mt-3 w-100">Register</button>
  </form>
  <p class="link text-center">Have an account? <a href="auth/login" >Login</a></p>
  </div>
</div>
