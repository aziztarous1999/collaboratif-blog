<h2 mat-dialog-title>Session Expired</h2>
<mat-dialog-content>Your session has expired. Would you like to stay logged in?</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">Logout</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="true">Renew</button>
</mat-dialog-actions>
